# Build and push Docker image to Docker Hub
name: Docker Build and Push

# Allow this workflow to be called by the main CI/CD pipeline
on:
  workflow_call:

jobs:
  # Build the application image and publish it to Docker Hub
  build-and-push:
    # Run the build on the self-hosted runner
    runs-on: self-hosted

    steps:
      # Download the repository code
      - name: Checkout Code
        uses: actions/checkout@v6

      # Configure Docker Buildx for image building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate the runner with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the Docker image and push it to Docker Hub
      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          # Use the repository root as the Docker build context
          context: .

          # Push the image after a successful build
          push: true

          # Create tags for branch, latest release, and commit version
          tags: |
            ${{ vars.DOCKERHUB_USER }}/github-actions-python-app:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USER }}/github-actions-python-app:latest
            ${{ vars.DOCKERHUB_USER }}/github-actions-python-app:${{ github.sha }}