name: Docker Build and Push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USER}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Docker build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{vars.DOCKERHUB_USER}}/github-actions-python-app:${{github.ref_name}}
            ${{vars.DOCKERHUB_USER}}/github-actions-python-app:latest
            ${{vars.DOCKERHUB_USER}}/github-actions-python-app:${{github.sha}}


