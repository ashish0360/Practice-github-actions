# Workflow name shown in the GitHub Actions tab
name: Docker Build and Push

# Trigger workflow whenever code is pushed to the main branch
on:
  workflow_call:

jobs:
  # Build the Docker image and push it to Docker Hub
  build-and-push:
    runs-on: self-hosted

    steps:
      # Download repository code to the GitHub Actions runner
      - name: Checkout Code
        uses: actions/checkout@v6

      # Authenticate the runner with Docker Hub
      # Username is stored as a GitHub Repository Variable
      # Token is stored as a GitHub Secret
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the Docker image and push it to Docker Hub
      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          # Repository root is used as the Docker build context
          context: .

          # Push image to Docker Hub after successful build
          push: true

          # Branch, latest, and commit SHA tags
          tags: |
            ${{ vars.DOCKERHUB_USER }}/github-actions-python-app:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USER }}/github-actions-python-app:latest
            ${{ vars.DOCKERHUB_USER }}/github-actions-python-app:${{ github.sha }}