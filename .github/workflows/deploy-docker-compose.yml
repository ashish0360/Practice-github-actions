name: Deploy Falsk App

on:
    workflow_dispatch:

jobs:
    deploy:
        env:
            DOCKERHUB_USER: ${{vars.DOCKERHUB_USER}}
        runs-on: self-hosted

        steps:
            - name: checkout code
              uses: actions/checkout@v5
                
            - name: deploying with docker compose
              run: docker compose down && docker compose up -d --build --force-recreate