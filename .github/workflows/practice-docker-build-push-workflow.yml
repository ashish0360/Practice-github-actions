name: Build Push to Dockerhub

# Run the workflow whenever code is pushed to main
on:
  push:
    branches: [main]

jobs:
  build-push: # Build and push Docker image
    runs-on: ubuntu-latest

    steps:

      # Download the repository code to the runner
      - name: Checkout Code
        uses: actions/checkout@v5

      # Authenticate with Docker Hub using GitHub credentials
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the Docker image and push it to Docker Hub
      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          # Push three tags: latest, commit SHA, and branch name
          tags: |
            ${{ vars.DOCKERHUB_USER }}/python-linting-app:latest
            ${{ vars.DOCKERHUB_USER }}/python-linting-app:${{ github.sha }}
            ${{ vars.DOCKERHUB_USER }}/python-linting-app:${{ github.ref_name }}