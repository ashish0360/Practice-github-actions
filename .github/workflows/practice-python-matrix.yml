name: Practice Python Linting App

# Run the workflow when code is pushed to main
on:
  push:
    branches: [main]

jobs:

  validate:
    # Use GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Test the application across multiple Python versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:

      # Download the repository code
      - name: Checkout Code
        uses: actions/checkout@v5

      # Install the selected Python version
      - name: Python Setup ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Install project dependencies
      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Check Python code quality using Flake8
      - name: Lint Code
        run: flake8 app.py

      # Start the Flask application in the background
