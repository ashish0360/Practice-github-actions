#API Keys, sensitive data, credentials
#Gitleaks
name: Secrets Scan

on:
    workflow_call:

jobs:
    secret-scan:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                fetch-depth: 0
            
            - name: Run GitLeaks Scanner
              uses: gitleaks/gitleaks-action@v2
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}} #github generate it automatically