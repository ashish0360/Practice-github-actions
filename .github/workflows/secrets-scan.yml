# Secret Scanning
# Gitleaks → Detects API keys, credentials and other sensitive data
name: Secrets Scan

# Allow this workflow to be called by the main CI/CD pipeline
on:
    workflow_call:

jobs:
    # Scan the repository for exposed secrets
    secret-scan:
        # Run the scan on the self-hosted runner
        runs-on: self-hosted

        steps:
            # Download the complete repository history for secret scanning
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                fetch-depth: 0

            # Remove temporary Gitleaks files from previous self-hosted runs
            - name: Clean Gitleaks temp files
              run: sudo rm -rf /tmp/gitleaks.tmp /tmp/gitleaks-*

            # Scan the repository for exposed secrets
            - name: Run Gitleaks Scanner
              uses: gitleaks/gitleaks-action@v2
              env:
                # GitHub automatically provides this token to the workflow
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}