#Dockerfile issue and vulnerability
name: Docker lint

on:
    workflow_call:

jobs:
    validate-dockerfile:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Validate Dockerfile
              uses: hadolint/hadolint-action@v3.1.0
              with:
                dcokerfile: dockerfile