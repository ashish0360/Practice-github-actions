#Packages = issues and vulnerabilities
#pip-audit for python code to scan packages
name: Dependency Scan

on:
    workflow_call:

jobs:
    dependency-check:
        runs-on: self-hosted

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Python 3.12
              uses: actions/setup-python@v5
              with:
                python-version: 3.12

            - name: Install pip-audit
              run: pip install pip-audit

            - name: Run PIP audit
              run: pip-audit -r requirements.txt