<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Zero To Hero</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 650px;
            padding: 30px;
        }

        h1 {
            font-size: 2.6rem;
            margin-bottom: 8px;
            color: #00d2ff;
        }

        .subtitle {
            color: #bbb;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            padding: 7px 18px;
            border: 1px solid #7b2ff7;
            border-radius: 20px;
            color: #c4b5fd;
            margin-bottom: 25px;
        }

        .section-title {
            margin-bottom: 15px;
            color: #7dd3fc;
        }

        .cards {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            padding: 18px;
            min-width: 170px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
        }

        .card span {
            display: block;
            color: #999;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .card strong {
            font-size: 18px;
        }

        .footer {
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 DevOps Zero To Hero</h1>

        <p class="subtitle">
            Learn • Build • Automate • Deploy
        </p>

        <div class="badge">Josh Batch 10</div>

        <h3 class="section-title">⚙️ CI/CD Pipeline</h3>

        <div class="cards">

            <div class="card">
                <span>Application</span>
                <strong>Flask 🐍</strong>
            </div>

            <div class="card">
                <span>Runtime</span>
                <strong>Python 3.14</strong>
            </div>

            <div class="card">
                <span>Container</span>
                <strong>Docker 🐳</strong>
            </div>

            <div class="card">
                <span>Deployment</span>
                <strong>AWS EC2 ☁️</strong>
            </div>

        </div>

        <p class="footer">
            Built with Flask • Docker • GitHub Actions • AWS
        </p>

    </div>

</body>
</html>
